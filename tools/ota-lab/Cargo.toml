[package]
name = "ota-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
self-replace = "=1.5.0"

[dev-dependencies]
self_update = { version = "=1.3.2", default-features = false, features = ["ureq", "native-tls", "github", "archive-zip", "compression-zip-deflate", "signatures"] }
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
zipsign-api = { version = "=0.2.2", default-features = false, features = ["sign-zip"] }

[[bin]]
name = "ota-fixture-v1"
path = "src/v1.rs"

[[bin]]
name = "ota-fixture-v2"
path = "src/v2.rs"
