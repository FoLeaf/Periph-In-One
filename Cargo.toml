[workspace]
members = ["crates/periph-hal", "tools/ota-lab", "tools/ota-release"]
resolver = "3"

[package]
name = "periph-in-one"
version = "0.23.2"
edition = "2024"
description = "A portable Windows peripheral battery monitor"
license = "MIT"
repository = "https://github.com/FoLeaf/Periph-In-One"
readme = "README.md"
publish = false
build = "build.rs"

[dependencies]
periph-hal = { path = "crates/periph-hal", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
self_update = { version = "=1.3.2", default-features = false, features = ["ureq", "native-tls", "github", "archive-zip", "compression-zip-deflate", "signatures"] }
zip = { version = "=9.1.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
periph-hal = { path = "crates/periph-hal", features = ["windows-backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
slint = { version = "=1.17.0", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "raw-window-handle-06", "unstable-winit-030"] }
tray-icon = { version = "0.23", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Memory", "Win32_System_DataExchange"] }
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.17.0"
winresource = { version = "=0.1.34", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
periph-hal = { path = "crates/periph-hal", features = ["diagnostics"] }
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
png = "0.18"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

