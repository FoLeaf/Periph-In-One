[package]
name = "periph-hal"
version = "0.1.0"
edition = "2024"
description = "Protocol-independent peripheral discovery and capability contracts"
license = "MIT"
publish = false

[features]
default = []
windows-backend = ["dep:hidapi", "dep:windows-sys"]
diagnostics = ["windows-backend"]

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"], optional = true }
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_Properties", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_IO"] }
