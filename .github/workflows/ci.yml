name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PERIPH_OTA_PUBLIC_KEYS: ${{ vars.PERIPH_OTA_PUBLIC_KEYS }}

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  portable-hal:
    name: Portable HAL
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test -p periph-hal --no-default-features --locked --all-targets
      - run: cargo test -p periph-hal --no-default-features --features serde --locked --all-targets
      - run: cargo clippy -p periph-hal --no-default-features --locked --all-targets -- -D warnings

  windows:
    name: Windows x64
    needs: format
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $json = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read package version' }
          $package = ($json | ConvertFrom-Json).packages | Where-Object name -eq 'periph-in-one'
          if ($env:RELEASE_TAG -cne "v$($package.version)") {
            throw "Tag $env:RELEASE_TAG must match Cargo.toml version v$($package.version)"
          }
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test all targets
        run: cargo test --workspace --locked --all-targets
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Build release
        run: |
          cargo build --locked --release -p periph-in-one -p ota-release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Package portable and unsigned OTA from the same EXE
        run: |
          $json = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read version' }
          $package = ($json | ConvertFrom-Json).packages | Where-Object name -eq 'periph-in-one'
          ./target/release/ota-release.exe prepare target/release/periph-in-one.exe dist $package.version
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Hash distribution
        run: |
          $archives = @(Get-ChildItem -Path dist/*.zip -File)
          if ($archives.Count -ne 2) { throw 'Expected portable and unsigned OTA ZIPs' }
          $lines = foreach ($archive in $archives) {
            $hash = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($archive.Name)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Copy-Item -LiteralPath target/release/ota-release.exe -Destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: periph-in-one-windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/ota-release.exe
          if-no-files-found: error
          retention-days: 14
